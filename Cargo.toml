[package]
name = "aevum-intent-solver"
version = "0.1.0"
edition = "2021"
authors = ["Konstantin <markankamaransheogarat-sys@users.noreply.github.com>"]
description = "⚡ Ultra-Low Latency Cross-DEX Cyclic Arbitrage & MEV Intent Solver Engine in Rust"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
